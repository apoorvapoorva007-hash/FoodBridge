services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=replace-this-secret
      - DATABASE_URL=sqlite:////data/foodbridge.db
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - foodbridge_data:/data
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
volumes:
  foodbridge_data:
